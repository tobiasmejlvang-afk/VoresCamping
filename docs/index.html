<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3d2e">
  <meta name="description" content="Vores Camping – personlig campingdagbog, kort, ønskeliste og cykelruter.">
  <title>Vores Camping</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://tiles.openfreemap.org">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="offlineBanner" class="offline-banner" hidden>Du er offline – dine gemte data virker stadig, men kort og onlinesøgning kan være begrænset.</div>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Hovedmenu">
      <a class="brand" href="#/overblik" aria-label="Gå til overblik">
        <img id="brandLogo" src="assets/logo.png" alt="Vores Camping logo">
      </a>
      <div class="profile-card">
        <span class="profile-avatar" aria-hidden="true"><i data-lucide="user-round"></i></span>
        <div><small id="profileGreeting">Godmorgen</small><strong id="profileNames">Sisi &amp; Jan</strong></div>
      </div>
      <nav class="side-nav">
        <a href="#/overblik" data-route="overblik"><i data-lucide="house"></i><span>Overblik</span></a>
        <a href="#/besoegte" data-route="besoegte"><i data-lucide="map-pin-check"></i><span>Besøgte</span></a>
        <a href="#/kort" data-route="kort"><i data-lucide="map"></i><span>Kort</span></a>
        <a href="#/bedst" data-route="bedst"><i data-lucide="star"></i><span>Bedst bedømte</span></a>
        <a href="#/oenskeliste" data-route="oenskeliste"><i data-lucide="heart"></i><span>Vil besøge</span></a>
        <a href="#/indstillinger" data-route="indstillinger"><i data-lucide="settings"></i><span>Indstillinger</span></a>
      </nav>
      <section id="sidebarCountdown" class="sidebar-countdown" aria-label="Næste campingtur"></section>
      <img class="sidebar-landscape" src="assets/hero-camping.jpg" alt="Campingvogne i bjerglandskab">
    </aside>

    <header class="mobile-header">
      <img src="assets/logo.png" alt="Vores Camping">
      <div><strong id="mobileAppName">Vores Camping</strong><small id="mobileSubtitle">Vores ture, vores minder</small></div>
      <button class="icon-button" data-action="quick-add" aria-label="Tilføj campingplads"><i data-lucide="plus"></i></button>
    </header>

    <main id="app" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Mobilmenu">
      <a href="#/overblik" data-route="overblik"><i data-lucide="house"></i><span>Overblik</span></a>
      <a href="#/besoegte" data-route="besoegte"><i data-lucide="map-pin-check"></i><span>Besøgte</span></a>
      <a href="#/kort" data-route="kort"><i data-lucide="map"></i><span>Kort</span></a>
      <a href="#/bedst" data-route="bedst"><i data-lucide="star"></i><span>Bedst</span></a>
      <a href="#/oenskeliste" data-route="oenskeliste"><i data-lucide="heart"></i><span>Ønsker</span></a>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <input id="hiddenImport" type="file" accept="application/json,.json" hidden>

  <script src="maps.js" defer></script>
  <script src="app.js" defer></script>
  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js" async onload="window.dispatchEvent(new Event('camping-libs-ready'))"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" async onload="window.dispatchEvent(new Event('camping-libs-ready'))"></script>
</body>
</html>
