<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e3">
  <title>Vores Camping</title>
  <link rel="manifest" href="manifest.webmanifest?v=21">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192-v21.png">
  <link rel="apple-touch-icon" href="assets/icon-192-v21.png">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://api.heigit.org">
  <link rel="preconnect" href="https://tiles.openfreemap.org">
  <link href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=21">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Vores Camping</h1>
          <p id="page-subtitle">Personlig campingdagbog og overblik</p>
        </div>
        <div class="topbar-actions"></div>
      </header>
      <section id="error-banner" class="error-banner hidden"></section>
      <section id="toast" class="toast hidden"></section>
      <section id="view" class="view"></section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottom-nav"></nav>
  <section class="quick-dock" id="quick-dock" aria-label="Hurtighandlinger"></section>

  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog" class="dialog-card">
      <h3 id="confirm-title">Bekræft</h3>
      <p id="confirm-message">Er du sikker?</p>
      <menu>
        <button value="cancel" class="ghost-btn">Annuller</button>
        <button value="confirm" class="primary-btn danger">Ja, fortsæt</button>
      </menu>
    </form>
  </dialog>

  <script src="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js"></script>
  <script src="ors.js?v=21"></script>
  <script src="maps.js?v=21"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
