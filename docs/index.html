<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f5c4c">
  <meta name="description" content="Vores Camping – personlig dansk campingdagbog med billeder, vurderinger, ønskeliste, cykelruter og integreret kort og Google Maps.">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=20260802-8">
  <title>Vores Camping</title>
  <script>
    window.__VC_STARTED__ = false;
    window.addEventListener('error', function (event) {
      console.error('Vores Camping:', event.error || event.message);
      var root = document.getElementById('app');
      if (!root) return;
      setTimeout(function () {
        if (!window.__VC_STARTED__) {
          root.innerHTML = '<main class="fatal"><img src="assets/logo.jpg" alt="Vores Camping"><h1>Appen kunne ikke starte</h1><p>En programfil blev ikke indlæst. Genindlæs siden med <strong>Ctrl + F5</strong>.</p><button onclick="location.reload()">Prøv igen</button></main>';
        }
      }, 100);
    });
  </script>
</head>
<body>
  <div id="app">
    <main class="splash" aria-live="polite">
      <img src="assets/logo.jpg" alt="Vores Camping">
      <div class="spinner"></div>
      <p>Pakker campingvognen…</p>
    </main>
  </div>
  <noscript>JavaScript skal være slået til for at bruge Vores Camping.</noscript>
  <script src="maps.js?v=20260802-8"></script>
  <script src="app.js?v=20260802-8"></script>
</body>
</html>
